[project]
name = "portable-era5-preprocessing"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "netCDF4>=1.6,<2", "geopandas>=1.0,<2", "pyproj>=3.6,<4",
  "shapely>=2.0,<3", "pyogrio>=0.9,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.uv]
package = false
[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
tmp_path_retention_policy = "none"
tmp_path_retention_count = 0
