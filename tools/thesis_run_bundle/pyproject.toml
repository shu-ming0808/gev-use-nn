[project]
name = "thesis-portable-cpu"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==2.2.6", "pandas==2.3.3", "scipy==1.15.3", "scikit-learn==1.7.2",
  "torch==2.11.0", "geopandas==1.1.4", "shapely==2.1.2", "pyproj==3.7.1",
  "netcdf4==1.7.4", "xarray==2024.11.0", "matplotlib==3.10.9", "joblib==1.6.0",
  "rasterio==1.4.4", "pykrige==1.7.3", "threadpoolctl==3.6.0", "psutil>=7,<8",
  "ipython>=8,<9",
]
[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
