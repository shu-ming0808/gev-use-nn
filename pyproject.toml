[project]
name = "gev-use-nn"
version = "0.1.0"
description = "Neural-network GEV estimation and spatial GP modelling for Taiwan temperature extremes"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "cdsapi>=0.7",
    "geopandas>=0.13",
    "joblib>=1.3",
    "matplotlib>=3.6",
    "netcdf4>=1.6",
    "numpy>=1.23",
    "pandas>=1.5",
    "pykrige>=1.7",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "shapely>=2.0",
    "torch==2.11.0",
    "xarray>=2024.1,<2025",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.0",
]

[tool.uv]
package = false

# Use the CUDA build on this Windows/NVIDIA workstation, including after uv sync.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
